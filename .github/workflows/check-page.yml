name: Check the public page
on:
  workflow_dispatch:
  page_build:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Page is public over HTTPS and identifies the app and developer
        run: |
          URL=https://marcelpintoberlin-hue.github.io/wonderdoku-privacy/
          for i in $(seq 1 20); do
            CODE=$(curl -s -o page.html -w '%{http_code}' "$URL" || true)
            # Wait until the new version (not an older build) is online.
            [ "$CODE" = "200" ] && grep -q "WonderDoku — Privacy Policy" page.html && break
            echo "HTTP $CODE, waiting for the GitHub Pages deployment..."; sleep 30
          done
          echo "HTTP $CODE $URL"
          [ "$CODE" = "200" ] || exit 1
          grep -q "WonderDoku — Privacy Policy" page.html
          grep -q "MP Tech DE" page.html
          grep -q "de.mptech.wonderdoku" page.html
          echo "Page OK (no login: curl sends no credentials)."
          T=https://marcelpintoberlin-hue.github.io/wonderdoku-privacy/terms.html
          for i in $(seq 1 20); do
            TC=$(curl -s -o terms.html -w '%{http_code}' "$T" || true)
            [ "$TC" = "200" ] && grep -q "WonderDoku — Terms of Use" terms.html && break
            echo "Terms HTTP $TC, waiting..."; sleep 30
          done
          echo "HTTP $TC $T"
          [ "$TC" = "200" ] && grep -q "WonderDoku — Terms of Use" terms.html && grep -q "de.mptech.wonderdoku" terms.html
          grep -q "Firebase Crashlytics" page.html || { echo "policy does not describe Firebase"; exit 1; }
          echo "Terms OK."
          echo "Links:"
          for u in $(cat page.html terms.html | grep -o 'href="https[^"]*"' | cut -d'"' -f2 | sort -u); do
            echo "$(curl -s -o /dev/null -L -w '%{http_code}' --max-time 30 "$u") $u"
          done
